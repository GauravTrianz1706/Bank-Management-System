version: '3.8'

services:
  bankmanagement-app:
    image: bankmanagement-system:latest
    container_name: bankmanagement-system
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HEALTH_CHECK_PORT=8080
      - STARTUP_USER=containeruser
      - DOTNET_RUNNING_IN_CONTAINER=true
      # Database connection (configure based on your environment)
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-Server=host.docker.internal;Database=BankDB;User Id=sa;Password=YourPassword;}
      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-Information}
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
      # Mount configuration files if needed
      - ./config:/app/config
    networks:
      - bank-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "powershell", "-Command", "try { $response = Invoke-WebRequest -Uri http://localhost:8080/health -UseBasicParsing; exit 0 } catch { exit 1 }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  bank-network:
    driver: bridge
