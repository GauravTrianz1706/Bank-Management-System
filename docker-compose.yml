version: '3.8'

services:
  bankmanagement-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bankmanagement-system:latest
    container_name: bankmanagement-app
    ports:
      - "8080:8080"
    environment:
      # Application environment variables
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - TZ=UTC
      - HEALTH_CHECK_PORT=8080
      - CURRENT_USER=containeruser
      
      # Database connection (configure for external database)
      - DB_CONNECTION_STRING=Data Source=${DB_HOST:-localhost};Initial Catalog=${DB_NAME:-OpenBankLocal};User ID=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True
      
      # Logging configuration
      - LOG_LEVEL=Information
      - LOG_PATH=/app/logs
    
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
      # Mount configuration files if needed
      - ./config:/app/config
    
    networks:
      - bankapp-network
    
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  bankapp-network:
    driver: bridge
