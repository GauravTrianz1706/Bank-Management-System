version: '3.8'

services:
  bankdatabaseaccess-app:
    build:
      context: ..
      dockerfile: BankDatabaseAccess/Dockerfile
    image: bankdatabaseaccess:latest
    container_name: bankdatabaseaccess-app
    ports:
      - "8080:8080"
    environment:
      - DOTNET_ENVIRONMENT=Production
      - HEALTH_CHECK_PORT=8080
      - CURRENT_USER=containeruser
      - TZ=UTC
      # Database connection (configure as needed)
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-}
      - DB_SERVER=${DB_SERVER:-}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  config:
