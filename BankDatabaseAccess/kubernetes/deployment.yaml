apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankdatabaseaccess
  namespace: bankdatabaseaccess
  labels:
    app: bankdatabaseaccess
    version: v1
    component: library
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bankdatabaseaccess
  template:
    metadata:
      labels:
        app: bankdatabaseaccess
        version: v1
        component: library
    spec:
      containers:
      - name: bankdatabaseaccess
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        
        env:
        # .NET Configuration
        - name: DOTNET_ENVIRONMENT
          value: "Production"
        - name: DOTNET_RUNNING_IN_CONTAINER
          value: "true"
        
        # Database Configuration
        # Replace these placeholders with actual values during deployment
        - name: DATABASE_SERVER
          value: "{{DATABASE_SERVER}}"
        - name: DATABASE_NAME
          value: "{{DATABASE_NAME}}"
        - name: DATABASE_USER
          value: "{{DATABASE_USER}}"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bankdatabaseaccess-secrets
              key: database-password
              optional: true
        - name: CONNECTION_STRING
          value: "Server={{DATABASE_SERVER}};Database={{DATABASE_NAME}};User Id={{DATABASE_USER}};Password=$(DATABASE_PASSWORD);TrustServerCertificate=True;"
        
        # Logging Configuration
        - name: LOG_LEVEL
          value: "Information"
        - name: LOG4NET_CONFIG
          value: "/app/config/log4net.config"
        
        # Application Settings
        - name: TZ
          value: "UTC"
        
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        
        # Volume mounts for configuration and logs
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
        
        # Health checks
        # Note: This is a class library, health checks may not be applicable
        # Adjust based on actual deployment scenario
        livenessProbe:
          exec:
            command:
            - test
            - -f
            - /app/BankDatabaseAccess.dll
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
            - test
            - -f
            - /app/BankDatabaseAccess.dll
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      
      volumes:
      - name: config
        configMap:
          name: bankdatabaseaccess-config
          optional: true
      - name: logs
        emptyDir: {}
      
      # Security context
      securityContext:
        runAsNonRoot: false
        fsGroup: 1000
      
      # Restart policy
      restartPolicy: Always
