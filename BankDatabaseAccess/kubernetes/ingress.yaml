apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bankdatabaseaccess-ingress
  namespace: bankdatabaseaccess
  labels:
    app: bankdatabaseaccess
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    appgw.ingress.kubernetes.io/request-timeout: "30"
spec:
  rules:
  - host: bankdatabaseaccess.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bankdatabaseaccess-service
            port:
              number: 80
  # Uncomment for TLS/HTTPS support
  # tls:
  # - hosts:
  #   - bankdatabaseaccess.example.com
  #   secretName: bankdatabaseaccess-tls
