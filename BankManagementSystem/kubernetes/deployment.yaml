apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankmanagementsystem
  namespace: bankmanagementsystem
  labels:
    app: bankmanagementsystem
    version: v1
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bankmanagementsystem
  template:
    metadata:
      labels:
        app: bankmanagementsystem
        version: v1
    spec:
      containers:
      - name: bankmanagementsystem
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: health
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: HEALTH_CHECK_PORT
          value: "8080"
        - name: STARTUP_USER
          value: "containeruser"
        - name: DATABASE_CONNECTION_STRING
          value: "{{DATABASE_CONNECTION_STRING}}"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
