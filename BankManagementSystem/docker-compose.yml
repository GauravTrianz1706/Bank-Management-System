version: '3.8'

services:
  bankmanagement-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bankmanagementsystem:latest
    container_name: bankmanagement-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - HEALTH_CHECK_PORT=8080
      - STARTUP_USER=containerized
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      # Database connection (configure as needed)
      - DB_CONNECTION_STRING=Data Source=db-server;Initial Catalog=OpenBankLocal;User ID=sa;Password=YourPassword
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  config:
